3003157321"}, {"sku": "VQB953PLG-2", "nome": "LJU - LIQ FB - Morango com Caramelo - 30 - 03mg/mL", "gtin": "3589358315730"}, {"sku": "VQB953PLG-3", "nome": "LJU - LIQ FB - Morango com Caramelo - 30 - 00mg/mL", "gtin": "3589300315733"}, {"sku": "VVC9WK2YW-1", "nome": "LJU - LIQ FB - Banana com Canela - 30 - 06mg/mL", "gtin": "9876543260123"}, {"sku": "VVC9WK2YW-2", "nome": "LJU - LIQ FB - Banana com Canela - 30 - 03mg/mL", "gtin": "9876543250124"}, {"sku": "VVC9WK2YW-3", "nome": "LJU - LIQ FB - Banana com Canela - 30 - 00mg/mL", "gtin": "9876543240125"}, {"sku": "YAVG2a143s521-1", "nome": "TJU - LIQ FB - Watermelon Day - 30 - 06mg/mL", "gtin": "8209850623328"}, {"sku": "YAVG2a143s521-2", "nome": "TJU - LIQ FB - Watermelon Day - 30 - 03mg/mL", "gtin": "8209850625520"}, {"sku": "YAVG2a143s521-3", "nome": "TJU - LIQ FB - Watermelon Day - 30 - 00mg/mL", "gtin": "8209850621126"}, {"sku": "ZP8YD8RDD", "nome": "LVP - LIQ FB - Pecan Pie", "gtin": "6921291309600"}, {"sku": "ZP8YD8RDD-1", "nome": "LVP - LIQ FB - Pecan Pie - 30 - 06mg/mL", "gtin": "2506291309603"}, {"sku": "ZP8YD8RDD-2", "nome": "LVP - LIQ FB - Pecan Pie - 30 - 00mg/mL", "gtin": "6921291309600"}, {"sku": "hbjf513FAVS-30-00mg", "nome": "TJU - LIQ FB - Ice Watermelon - 30 - 00mg/mL", "gtin": "8903903919023"}, {"sku": "hbjf513FAVS-30-03mg", "nome": "TJU - LIQ FB - Ice Watermelon - 30 - 03mg/mL", "gtin": "8906104919021"}, {"sku": "hbjf513FAVS-30-06mg", "nome": "TJU - LIQ FB - Ice Watermelon - 30 - 06mg/mL", "gtin": "8999903919026"}];
const PADRAO = { cols:2, pw:102, ph:30, gap:2, mx:0, fs:8 };
const CFG_IDS = Object.keys(PADRAO);
const qtd = {};
const $ = id => document.getElementById(id);
const norm = s => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

// Configuração da impressora fica salva no navegador do fornecedor.
try { const s = JSON.parse(localStorage.getItem("etq_cfg") || "{}"); CFG_IDS.forEach(k => { if (s[k] != null) $(k).value = s[k]; }); } catch (e) {}
function cfg() {
  const c = {}; CFG_IDS.forEach(k => c[k] = parseFloat($(k).value) || 0);
  c.cols = Math.max(1, Math.round(c.cols)); c.pw = c.pw || 102; c.ph = c.ph || 30; c.fs = c.fs || 8;
  try { localStorage.setItem("etq_cfg", JSON.stringify(c)); } catch (e) {}
  return c;
}

function listar() {
  const termos = norm($("busca").value).split(/\s+/).filter(Boolean);
  const achados = PRODUTOS.filter(p => {
    const h = norm(p.nome + " " + p.sku + " " + p.gtin);
    return termos.every(t => h.includes(t));
  });
  // Selecionados primeiro, pra não perder de vista o que já foi escolhido.
  achados.sort((a, b) => (qtd[b.sku] ? 1 : 0) - (qtd[a.sku] ? 1 : 0));
  const el = $("lista"); el.innerHTML = "";
  if (!achados.length) { el.innerHTML = '<div class="vazio">Nenhum produto encontrado.</div>'; return; }
  achados.slice(0, 300).forEach(p => {
    const d = document.createElement("div");
    d.className = "it" + (qtd[p.sku] ? " on" : "");
    d.innerHTML = '<div class="n"></div><div class="s"></div><input type="number" min="0" placeholder="0">';
    d.querySelector(".n").textContent = p.nome;
    d.querySelector(".s").textContent = p.sku + " · " + p.gtin;
    const inp = d.querySelector("input");
    inp.value = qtd[p.sku] || "";
    inp.oninput = () => {
      const v = Math.max(0, parseInt(inp.value, 10) || 0);
      if (v) qtd[p.sku] = v; else delete qtd[p.sku];
      d.classList.toggle("on", !!v);
      gerar();
    };
    el.appendChild(d);
  });
}

function formato(gtin) {
  if (/^\d{13}$/.test(gtin)) return "EAN13";
  if (/^\d{8}$/.test(gtin)) return "EAN8";
  if (/^\d{12}$/.test(gtin)) return "UPC";
  return "CODE128";
}

function gerar() {
  const c = cfg();
  $("dyn").textContent = `@page { size:${c.pw}mm ${c.ph}mm; margin:0; }
    .row { width:${c.pw}mm; height:${c.ph}mm; gap:${c.gap}mm; padding:0 ${c.mx}mm; }`;
  const lista = [];
  PRODUTOS.forEach(p => { for (let i = 0; i < (qtd[p.sku] || 0); i++) lista.push(p); });
  $("tot").textContent = lista.length ? `${lista.length} etiqueta(s) · ${Math.ceil(lista.length / c.cols)} linha(s) de bobina` : "Nenhuma etiqueta";
  const area = $("area"); area.innerHTML = "";
  if (lista.length > 3000) { $("tot").textContent += " — máximo de 3000 por vez"; return; }
  for (let i = 0; i < lista.length; i += c.cols) {
    const row = document.createElement("div"); row.className = "row";
    for (let j = 0; j < c.cols; j++) {
      const cell = document.createElement("div"); cell.className = "cell";
      const p = lista[i + j];
      if (p) {
        const nm = document.createElement("div"); nm.className = "nm"; nm.style.fontSize = c.fs + "pt"; nm.textContent = p.nome;
        const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        const cd = document.createElement("div"); cd.className = "cd"; cd.style.fontSize = Math.max(6, c.fs) + "pt"; cd.textContent = p.gtin;
        cell.append(nm, svg, cd);
        try {
          JsBarcode(svg, p.gtin, { format: formato(p.gtin), displayValue:false, margin:0, width:2, height:40 });
        } catch (e) {
          try { JsBarcode(svg, p.gtin, { format:"CODE128", displayValue:false, margin:0, width:2, height:40 }); } catch (e2) { svg.remove(); }
        }
        if (svg.isConnected) { svg.style.height = (c.ph * 0.42) + "mm"; svg.setAttribute("preserveAspectRatio", "none"); svg.removeAttribute("height"); }
      }
      row.appendChild(cell);
    }
    area.appendChild(row);
  }
}

$("busca").oninput = listar;
CFG_IDS.forEach(k => $(k).oninput = gerar);
$("reset").onclick = () => { CFG_IDS.forEach(k => $(k).value = PADRAO[k]); gerar(); };
$("limpar").onclick = () => { Object.keys(qtd).forEach(k => delete qtd[k]); listar(); gerar(); };
$("print").onclick = () => { gerar(); if (!$("area").children.length) { alert("Coloque a quantidade em pelo menos um produto."); return; } window.print(); };
if (typeof JsBarcode === "undefined") alert("Não foi possível carregar o código de barras. Verifique a internet e recarregue a página.");
listar(); gerar();
</script>
